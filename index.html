<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Records</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#111827;--mu:#6b7280;--pr:#1446aa;--ln:#e5e7eb;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--pr:#6ea0ff;--ln:#334155;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
button.p,nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
@media (prefers-color-scheme:dark){button.p,nav button.on{color:#0b1220}}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.k b{display:block;font-size:19px}
input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mu);display:block;margin-top:6px}
.t{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sm{width:76px}
#msg{position:fixed;left:12px;right:12px;bottom:12px;background:#b91c1c;color:#fff;border-radius:8px;padding:10px;display:none;z-index:9}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#rc>div{background:#fff;color:#111;border-radius:12px;padding:18px;max-width:340px;width:100%}
#rc.cd>div{max-width:560px;max-height:92vh;overflow:auto}
#rc td,#rc th{border-color:#ddd}
@media print{.top,nav,.c,.g,.np{display:none!important}body{background:#fff}#rc{position:static;background:none;padding:0}#rc>div{max-width:none;max-height:none}}
</style></head><body><div class="w" id="app"></div><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL='https://blnufyoeoykygbstlleh.supabase.co',SUPABASE_KEY='sb_publishable_YGrD8W-mALsDaZ3tiLCfRw_C5UiCXrK';
var sb=null,me=null,tab='',armed=null,rcpt=null,q='',cls='',sub='',cardId=null;
var S={school:'School',term:'Term 1',subjects:[],cw:50,ew:50,students:[],payments:[],scores:{},rem:{},staff:[]};
var CL=['Creche','Nursery','KG 1','KG 2','Basic 1','Basic 2','Basic 3','Basic 4','Basic 5','Basic 6','JHS 1','JHS 2','JHS 3'];
var GR=['','Highest','Higher','High','High average','Average','Low average','Low','Lower','Lowest'];
var TABS={admin:['home','stu','fee','rep','sco','rpt','stf'],accounts:['home','stu','fee','rep'],teacher:['sco','rpt']};
var LBL={home:'Home',stu:'Pupils',fee:'Fees',rep:'Balances',sco:'Scores',rpt:'Reports',stf:'Staff'};
function $(s){return document.querySelector(s)}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function m(n){return 'GH\u20B5'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function note(t){var e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function ok(r){if(r.error){note(r.error.message);return false}return true}
function can(a){var r=me.role;return a==='admin'?r==='admin':a==='money'?(r==='admin'||r==='accounts'):(r==='admin'||r==='teacher')}
function paid(id){return S.payments.filter(function(p){return p.sid===id}).reduce(function(a,p){return a+p.amt},0)}
function bal(s){return s.fee-paid(s.id)}
function nm(id){var s=S.students.filter(function(x){return x.id===id})[0];return s?s.name:'(removed)'}
function rn(x){return 'R'+String(x).padStart(4,'0')}

async function init(){
  if(SUPABASE_URL.indexOf('PASTE')===0){$('#app').innerHTML='<div class="c"><h2>Setup needed</h2><p>Open index.html and paste your Supabase project URL and anon key at the top of the script. See SETUP.txt.</p></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'){me=null;loginV()}});
  var s=await sb.auth.getSession();
  if(s.data.session)boot(s.data.session.user);else loginV()
}
function loginV(){
  $('#app').innerHTML='<div class="c" style="max-width:380px;margin:40px auto"><h1>School Records</h1><p class="mu">Staff sign in</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="r"><button class="p" onclick="login()">Sign in</button></div></div>'
}
async function login(){
  var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(!ok(r))return;boot(r.data.user)
}
function out(){sb.auth.signOut()}
async function boot(u){
  var p=await sb.from('profiles').select('*').eq('id',u.id).single();
  if(!ok(p))return;
  me=p.data;tab=TABS[me.role][0];await loadAll();render()
}
async function loadAll(){
  var a=await sb.from('settings').select('*').eq('id',1).single();
  if(a.data){S.school=a.data.school;S.term=a.data.term;S.subjects=a.data.subjects;S.cw=a.data.cw;S.ew=a.data.ew}
  var b=await sb.from('students').select('*').order('name');
  S.students=(b.data||[]).map(function(x){return{id:x.id,name:x.name,cls:x.cls,guardian:x.guardian,phone:x.phone,date:x.adm,fee:+x.fee}});
  S.payments=[];
  if(can('money')){var c=await sb.from('payments').select('*').order('rno');
    S.payments=(c.data||[]).map(function(x){return{id:x.id,sid:x.sid,amt:+x.amt,date:x.pdate,method:x.method,term:x.term,rcpt:rn(x.rno)}})}
  S.scores={};S.rem={};
  var d=await sb.from('scores').select('*').eq('term',S.term);
  (d.data||[]).forEach(function(x){S.scores[S.term+'|'+x.sid+'|'+x.subject]={c:x.c,e:x.e}});
  var e=await sb.from('remarks').select('*').eq('term',S.term);
  (e.data||[]).forEach(function(x){S.rem[S.term+'|'+x.sid]={att:x.att,con:x.con,rem:x.rem}});
  if(me.role==='admin'){var f=await sb.from('profiles').select('*').order('email');S.staff=f.data||[]}
}
function go(t){tab=t;armed=null;q='';render()}

async function addStudent(){
  var n=$('#sn').value.trim();if(!n){$('#sn').focus();return}
  var r=await sb.from('students').insert({name:n,cls:$('#sc').value,guardian:$('#sg').value.trim(),phone:$('#sp').value.trim(),adm:$('#sd').value||today(),fee:parseFloat($('#sf').value)||0}).select().single();
  if(!ok(r))return;await loadAll();render()
}
async function delStudent(id){
  if(armed!==id){armed=id;render();return}
  var r=await sb.from('students').delete().eq('id',id);armed=null;if(ok(r)){await loadAll()}render()
}
async function addPay(){
  var sid=$('#ps').value,a=parseFloat($('#pa').value);
  if(!sid||!(a>0)){$('#pa').focus();return}
  var r=await sb.from('payments').insert({sid:sid,amt:a,pdate:$('#pd').value||today(),method:$('#pm').value,term:$('#pt').value.trim()||S.term}).select().single();
  if(!ok(r))return;await loadAll();rcpt=r.data.id;render()
}
async function delPay(id){
  if(armed!==id){armed=id;render();return}
  var r=await sb.from('payments').delete().eq('id',id);armed=null;if(ok(r)){await loadAll()}render()
}
async function setSet(){
  var j=$('#sj').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
  var r=await sb.from('settings').update({school:$('#ss').value.trim()||S.school,term:$('#st').value.trim()||S.term,subjects:j.length?j:S.subjects,cw:+$('#cw').value||S.cw,ew:+$('#ew').value||S.ew}).eq('id',1);
  if(ok(r)){await loadAll();render()}
}
async function setSc(el,id,f){
  var v=el.value===''?null:Math.max(0,Math.min(f==='c'?S.cw:S.ew,+el.value));if(v!==null)el.value=v;
  var k=S.term+'|'+id+'|'+sub;S.scores[k]=S.scores[k]||{};S.scores[k][f]=v;
  var t=tot(id,sub);$('#t'+id).textContent=t==null?'':t;
  var o=S.scores[k];ok(await sb.from('scores').upsert({sid:id,term:S.term,subject:sub,c:o.c==null?null:o.c,e:o.e==null?null:o.e}))
}
async function setRem(f,v){
  var k=S.term+'|'+cardId;S.rem[k]=S.rem[k]||{};S.rem[k][f]=v;var o=S.rem[k];
  ok(await sb.from('remarks').upsert({sid:cardId,term:S.term,att:o.att||null,con:o.con||null,rem:o.rem||null}))
}
async function setRole(id,role){ok(await sb.from('profiles').update({role:role}).eq('id',id))}

function grade(p){var t=[90,80,70,60,55,50,40,35];for(var i=0;i<8;i++)if(p>=t[i])return i+1;return 9}
function sc(s,j){return S.scores[S.term+'|'+s+'|'+j]||null}
function tot(s,j){var x=sc(s,j);return x?(+x.c||0)+(+x.e||0):null}
function sum(s){return S.subjects.reduce(function(a,j){return a+(tot(s,j)||0)},0)}
function pos(c){var l=S.students.filter(function(x){return x.cls===c}).map(function(x){return{s:x,t:sum(x.id)}}).sort(function(a,b){return b.t-a.t});l.forEach(function(x,i){x.p=i&&l[i-1].t===x.t?l[i-1].p:i+1});return l}
function ord(n){var a=['th','st','nd','rd'],v=n%100;return n+(a[(v-20)%10]||a[v]||a[0])}
function classes(){var c=S.students.map(function(x){return x.cls}).filter(function(v,i,a){return a.indexOf(v)===i});if(!cls||c.indexOf(cls)<0)cls=c[0]||'';return c.map(function(k){return '<option'+(k===cls?' selected':'')+'>'+esc(k)+'</option>'}).join('')}

function home(){
  var exp=0,col=0;S.students.forEach(function(s){exp+=s.fee;col+=paid(s.id)});
  var rec=S.payments.slice(-5).reverse().map(function(p){return '<tr><td>'+esc(p.date)+'</td><td>'+esc(nm(p.sid))+'</td><td>'+m(p.amt)+'</td></tr>'}).join('')||'<tr><td class="mu">No payments yet</td></tr>';
  var h='<div class="g"><div class="k"><span class="mu">Pupils</span><b>'+S.students.length+'</b></div><div class="k"><span class="mu">Fees expected</span><b>'+m(exp)+'</b></div><div class="k"><span class="mu">Collected</span><b class="ok">'+m(col)+'</b></div><div class="k"><span class="mu">Outstanding</span><b class="bad">'+m(exp-col)+'</b></div></div><div class="c" style="margin-top:12px"><h2>Recent payments</h2><div class="t"><table>'+rec+'</table></div></div>';
  if(can('admin'))h+='<div class="c"><h2>School settings</h2><label>School name</label><input id="ss" value="'+esc(S.school)+'"><label>Current term</label><input id="st" value="'+esc(S.term)+'"><label>Subjects (comma separated)</label><input id="sj" value="'+esc(S.subjects.join(', '))+'"><label>Class score out of / exam score out of</label><div style="display:flex;gap:6px"><input id="cw" type="number" value="'+S.cw+'"><input id="ew" type="number" value="'+S.ew+'"></div><div class="r"><button class="p" onclick="setSet()">Save</button></div></div>';
  return h
}
function studs(){
  var opt=CL.map(function(c){return '<option>'+c+'</option>'}).join('');
  var rows=S.students.filter(function(s){return !q||(s.name+s.cls+s.guardian).toLowerCase().indexOf(q.toLowerCase())>-1}).map(function(s){
    return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td>'+esc(s.guardian)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.date)+'</td><td>'+m(s.fee)+'</td><td><button onclick="delStudent(\''+s.id+'\')">'+(armed===s.id?'Sure?':'Delete')+'</button></td></tr>'}).join('')||'<tr><td class="mu">No pupils found</td></tr>';
  return '<div class="c"><h2>New admission</h2><label>Pupil’s full name</label><input id="sn"><label>Class</label><select id="sc">'+opt+'</select><label>Parent / guardian</label><input id="sg"><label>Phone</label><input id="sp" type="tel"><label>Admission date</label><input id="sd" type="date" value="'+today()+'"><label>Fee per term (GH₵)</label><input id="sf" type="number" min="0" inputmode="decimal"><div class="r"><button class="p" onclick="addStudent()">Admit pupil</button></div></div><div class="c"><h2>Pupils ('+S.students.length+')</h2><input placeholder="Search name, class, guardian" value="'+esc(q)+'" oninput="q=this.value;render()"><div class="t" style="margin-top:8px"><table><tr><th>Name</th><th>Class</th><th>Guardian</th><th>Phone</th><th>Admitted</th><th>Fee</th><th></th></tr>'+rows+'</table></div></div>'
}
function fees(){
  var so=S.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+' ('+esc(s.cls)+')</option>'}).join('');
  var rows=S.payments.slice().reverse().map(function(p){
    return '<tr><td>'+p.rcpt+'</td><td>'+esc(p.date)+'</td><td>'+esc(nm(p.sid))+'</td><td>'+esc(p.term)+'</td><td>'+esc(p.method)+'</td><td>'+m(p.amt)+'</td><td><button onclick="rcpt=\''+p.id+'\';render()">Receipt</button> <button onclick="delPay(\''+p.id+'\')">'+(armed===p.id?'Sure?':'Delete')+'</button></td></tr>'}).join('')||'<tr><td class="mu">No payments yet</td></tr>';
  return '<div class="c"><h2>Record a payment</h2>'+(S.students.length?'<label>Pupil</label><select id="ps">'+so+'</select><label>Amount (GH₵)</label><input id="pa" type="number" min="0" inputmode="decimal"><label>Date</label><input id="pd" type="date" value="'+today()+'"><label>Method</label><select id="pm"><option>Cash</option><option>Mobile money</option><option>Bank</option></select><label>Term</label><input id="pt" value="'+esc(S.term)+'"><div class="r"><button class="p" onclick="addPay()">Save payment</button></div>':'<p class="mu">Admit a pupil first.</p>')+'</div><div class="c"><h2>Payment history</h2><div class="t"><table><tr><th>No.</th><th>Date</th><th>Pupil</th><th>Term</th><th>Method</th><th>Amount</th><th></th></tr>'+rows+'</table></div></div>'
}
function reps(){
  var rows=S.students.slice().sort(function(a,b){return bal(b)-bal(a)}).map(function(s){var b=bal(s);return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td>'+esc(s.phone)+'</td><td>'+m(s.fee)+'</td><td>'+m(paid(s.id))+'</td><td class="'+(b>0?'bad':'ok')+'">'+m(b)+'</td></tr>'}).join('')||'<tr><td class="mu">No pupils yet</td></tr>';
  return '<div class="c"><h2>Fee balances</h2><p class="mu">Highest balance first.</p><div class="t"><table><tr><th>Name</th><th>Class</th><th>Phone</th><th>Fee</th><th>Paid</th><th>Balance</th></tr>'+rows+'</table></div></div>'
}
function scoresV(){
  var co=classes();if(!sub||S.subjects.indexOf(sub)<0)sub=S.subjects[0];
  var so=S.subjects.map(function(j){return '<option'+(j===sub?' selected':'')+'>'+esc(j)+'</option>'}).join('');
  var rows=S.students.filter(function(x){return x.cls===cls}).map(function(x){var o=sc(x.id,sub)||{},t=tot(x.id,sub);
    return '<tr><td>'+esc(x.name)+'</td><td><input class="sm" type="number" inputmode="decimal" value="'+(o.c==null?'':o.c)+'" onchange="setSc(this,\''+x.id+'\',\'c\')"></td><td><input class="sm" type="number" inputmode="decimal" value="'+(o.e==null?'':o.e)+'" onchange="setSc(this,\''+x.id+'\',\'e\')"></td><td id="t'+x.id+'">'+(t==null?'':t)+'</td></tr>'}).join('')||'<tr><td class="mu">No pupils in this class</td></tr>';
  return '<div class="c"><h2>Enter scores · '+esc(S.term)+'</h2><label>Class</label><select onchange="cls=this.value;render()">'+co+'</select><label>Subject</label><select onchange="sub=this.value;render()">'+so+'</select><div class="t" style="margin-top:8px"><table><tr><th>Pupil</th><th>Class /'+S.cw+'</th><th>Exam /'+S.ew+'</th><th>Total</th></tr>'+rows+'</table></div><p class="mu">Each box saves when you leave it.</p></div>'
}
function reportsV(){
  var co=classes(),l=pos(cls);
  var rows=l.map(function(x){return '<tr><td>'+ord(x.p)+'</td><td>'+esc(x.s.name)+'</td><td>'+x.t+'</td><td><button onclick="cardId=\''+x.s.id+'\';render()">Report</button></td></tr>'}).join('')||'<tr><td class="mu">No pupils in this class</td></tr>';
  return '<div class="c"><h2>Terminal reports · '+esc(S.term)+'</h2><label>Class</label><select onchange="cls=this.value;render()">'+co+'</select><div class="t" style="margin-top:8px"><table><tr><th>Pos.</th><th>Pupil</th><th>Total</th><th></th></tr>'+rows+'</table></div></div>'
}
function staffV(){
  var rows=S.staff.map(function(p){return '<tr><td>'+esc(p.email)+'</td><td><select onchange="setRole(\''+p.id+'\',this.value)"'+(p.id===me.id?' disabled':'')+'>'+['admin','accounts','teacher'].map(function(r){return '<option'+(p.role===r?' selected':'')+'>'+r+'</option>'}).join('')+'</select></td></tr>'}).join('');
  return '<div class="c"><h2>Staff roles</h2><p class="mu">Add new staff in Supabase (Authentication > Users > Add user), then set their role here. Teachers enter scores; accounts handles pupils and fees.</p><div class="t"><table><tr><th>Email</th><th>Role</th></tr>'+rows+'</table></div></div>'
}
function receipt(){
  var p=S.payments.filter(function(x){return x.id===rcpt})[0];if(!p)return '';
  var s=S.students.filter(function(x){return x.id===p.sid})[0]||{fee:0,cls:''};
  return '<div id="rc"><div><h2 style="text-align:center">'+esc(S.school)+'</h2><p style="text-align:center;margin:0 0 10px"><b>Fee receipt '+p.rcpt+'</b></p><p>Date: '+esc(p.date)+'<br>Pupil: '+esc(nm(p.sid))+' ('+esc(s.cls)+')<br>Term: '+esc(p.term)+'<br>Method: '+esc(p.method)+'</p><p style="font-size:20px"><b>Paid: '+m(p.amt)+'</b></p><p>Balance now: '+m(bal(s))+'</p><div class="r np"><button onclick="try{window.print()}catch(e){}">Print</button><button class="p" onclick="rcpt=null;render()">Close</button></div></div></div>'
}
function card(){
  var s=S.students.filter(function(x){return x.id===cardId})[0];if(!s)return '';
  var r=S.rem[S.term+'|'+s.id]||{},l=pos(s.cls),me2=l.filter(function(x){return x.s.id===s.id})[0];
  var rows=S.subjects.map(function(j){var x=sc(s.id,j)||{},t=tot(s.id,j),g=t==null?0:grade(t/(S.cw+S.ew)*100);
    return '<tr><td>'+esc(j)+'</td><td>'+(x.c==null?'':x.c)+'</td><td>'+(x.e==null?'':x.e)+'</td><td>'+(t==null?'':t)+'</td><td>'+(g||'')+'</td><td>'+GR[g]+'</td></tr>'}).join('');
  return '<div id="rc" class="cd"><div><h2 style="text-align:center;margin:0">'+esc(S.school)+'</h2><p style="text-align:center;margin:2px 0 8px"><b>Terminal report · '+esc(S.term)+'</b></p><p>Name: <b>'+esc(s.name)+'</b><br>Class: '+esc(s.cls)+' · Position: <b>'+ord(me2.p)+'</b> of '+l.length+'</p><div class="t"><table><tr><th>Subject</th><th>Class /'+S.cw+'</th><th>Exam /'+S.ew+'</th><th>Total</th><th>Grade</th><th>Remark</th></tr>'+rows+'</table></div><p>Overall total: <b>'+me2.t+'</b></p><label>Attendance</label><input value="'+esc(r.att)+'" onchange="setRem(\'att\',this.value)"><label>Conduct</label><input value="'+esc(r.con)+'" onchange="setRem(\'con\',this.value)"><label>Class teacher’s remark</label><input value="'+esc(r.rem)+'" onchange="setRem(\'rem\',this.value)"><div class="r np"><button onclick="try{window.print()}catch(e){}">Print</button><button class="p" onclick="cardId=null;render()">Close</button></div></div></div>'
}
function render(){
  var v={home:home,stu:studs,fee:fees,rep:reps,sco:scoresV,rpt:reportsV,stf:staffV}[tab]();
  var nav=TABS[me.role].map(function(t){return '<button class="'+(tab===t?'on':'')+'" onclick="go(\''+t+'\')">'+LBL[t]+'</button>'}).join('');
  var f=document.activeElement&&document.activeElement.placeholder;
  $('#app').innerHTML='<div class="top"><div><h1>'+esc(S.school)+'</h1><div class="mu">'+esc(S.term)+' · '+esc(me.email)+' ('+me.role+')</div></div><button onclick="out()">Sign out</button></div><nav>'+nav+'</nav>'+v+receipt()+card();
  if(f){var i=$('input[placeholder]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
init();
</script></body></html>
